name: AniMotion checks
on:
  push:
  pull_request:
jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python server
        run: python -m py_compile run_server.py
      - name: Check app assets
        run: |
          test -s index.html
          test -s README.md
          grep -q 'RTX 2050' README.md
          grep -q 'Motion Lab' index.html
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.parts))
                      self.in_script = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/animotion-inline.js").write_text("\n".join(parser.scripts), encoding="utf-8")
          PY
          node --check /tmp/animotion-inline.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
